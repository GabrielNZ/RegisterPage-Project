<div class="container-consulta">
    <div class="div-consulta">
        <form class="mt-60" #buscaForm="ngForm" (ngSubmit)="pesquisar(nome)">
            <mat-card>
                <mat-card-header>
                    <mat-card-title>Consulta</mat-card-title>
                </mat-card-header>
                <mat-card-content class="mt-20">
                    <div class="container-content">
                        <div class="div-content">
                            <mat-form-field class="full-width">
                                <mat-label>Nome:</mat-label>
                                <input type="text" placeholder="Ex: Gabriel" matInput [(ngModel)]="nome" name="nome">
                            </mat-form-field>
                        </div>
                    </div>
                </mat-card-content>
                <mat-card-actions>
                    <button mat-flat-button color="primary" type="submit" class="ml-5">
                        <mat-icon fontIcon="search"></mat-icon>
                        Pesquisar
                    </button>
                </mat-card-actions>
            </mat-card>
        </form>
    </div>
</div>
<div class="container-consulta mt-20">
    <div class="div-consulta">
        <mat-card>
            <mat-card-header>
                <mat-card-title>Resultado</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <table mat-table [dataSource]="listaClientes">
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef>Id</th>
                        <td mat-cell *matCellDef="let cliente">{{ cliente.id }}</td>
                    </ng-container>
                    <ng-container matColumnDef="nome">
                        <th mat-header-cell *matHeaderCellDef>Nome</th>
                        <td mat-cell *matCellDef="let cliente">{{ cliente.nome }}</td>
                    </ng-container>
                    <ng-container matColumnDef="cpf">
                        <th mat-header-cell *matHeaderCellDef>CPF</th>
                        <td mat-cell *matCellDef="let cliente">{{ cliente.cpf }}</td>
                    </ng-container>
                    <ng-container matColumnDef="dataNascimento">
                        <th mat-header-cell *matHeaderCellDef>Data de Nascimento</th>
                        <td mat-cell *matCellDef="let cliente">{{ cliente.dataNascimento }}</td>
                    </ng-container>
                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef>Email</th>
                        <td mat-cell *matCellDef="let cliente">{{ cliente.email }}</td>
                    </ng-container>
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef>Ações</th>
                        <td mat-cell *matCellDef="let cliente">
                            <button type="button" (click)="enviarEdicao(cliente.id)" mat-button><mat-icon fontIcon="edit"></mat-icon>Editar</button>
                            @if(!cliente.deletando) {
                                <button type="button" (click)="preparaDeletar(cliente)" mat-button><mat-icon fontIcon="delete"></mat-icon>Deletar</button>
                            } @else {
                                <button type="button" (click)="deletar(cliente)" mat-button><mat-icon fontIcon="question_mark"></mat-icon>Confirmar</button>
                            }
                            
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="consultaTableColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: consultaTableColumns;"></tr>
                    <tr *matNoDataRow>
                        <td>
                            Nenhum registro encontrado
                        </td>
                    </tr>
                </table>
            </mat-card-content>
        </mat-card>
    </div>
</div>
